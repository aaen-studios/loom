<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
  <!-- loom's mark: one thread with a loop that crosses itself (the knot an
       agent ties when it's waiting for you). The falling stroke passes over
       the rising one; the mask cuts a real gap there, so it works on any
       background. -->
  <mask id="loom-knot-over" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
    <rect width="32" height="32" fill="white"/>
    <path d="M13.67 22.24 C 14.8 23.3, 16.3 24.1, 18.14 24.34" stroke="black" stroke-width="5.6"/>
  </mask>
  <path d="M3 24.5 H12 C 19 24.5, 22 18.5, 22 14 C 22 9.5, 19 7, 16 7 C 13 7, 10 9.5, 10 14" mask="url(#loom-knot-over)"/>
  <path d="M10 14 C 10 19, 13.5 24.5, 20 24.5 H29"/>
</svg>
