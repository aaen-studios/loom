# The iPhone app's Xcode project, for XcodeGen. `calx scripts/ios.calx` builds the
# core and runs `xcodegen` here, which makes Loom.xcodeproj. The project isn't kept
# in git: change this file instead (ios/README.md).
name: Loom
include:
  # The Calx core, linked as LoomCore.xcframework, once scripts/ios.calx has made it.
  # Without it the app is built on sample frames, for working on the screens alone.
  - path: core.yml
    enable: ${LOOM_CORE}
options:
  bundleIdPrefix: no.aaenz
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  Loom:
    type: application
    platform: iOS
    sources:
      - path: Loom
      - path: ../design/generated/Tokens.swift
        group: Loom/Design
      # The app icon from design/logo/ios, which scripts/ios.calx puts in a catalog.
      - path: ../build/ios/Icons.xcassets
        group: Loom/Resources
        optional: true
      # Twemoji's pictures from design/twemoji/svg, which scripts/ios.calx puts in a
      # catalog that keeps their vectors, and which emoji each is (PLAN.md, "Emoji").
      - path: ../build/ios/Twemoji.xcassets
        group: Loom/Resources
        optional: true
      # Spools' marks from server/catalog, which scripts/ios.calx puts in a catalog that
      # keeps their vectors, each named for its entry (`mark-acta`).
      - path: ../build/ios/Marks.xcassets
        group: Loom/Resources
        optional: true
      - path: ../design/twemoji/sequences.txt
        group: Loom/Resources
        buildPhase: resources
      # loom's sounds, which notifications name and the app plays (design/sounds).
      - path: ../design/sounds/loom-reply.wav
        group: Loom/Resources/Sounds
        buildPhase: resources
      - path: ../design/sounds/loom-waiting.wav
        group: Loom/Resources/Sounds
        buildPhase: resources
      - path: ../design/sounds/loom-routine.wav
        group: Loom/Resources/Sounds
        buildPhase: resources
      - path: ../design/sounds/loom-failed.wav
        group: Loom/Resources/Sounds
        buildPhase: resources
      - path: ../design/sounds/loom-sent.wav
        group: Loom/Resources/Sounds
        buildPhase: resources
      - path: ../design/sounds/loom-dictation-on.wav
        group: Loom/Resources/Sounds
        buildPhase: resources
      - path: ../design/sounds/loom-dictation-off.wav
        group: Loom/Resources/Sounds
        buildPhase: resources
      - path: ../desktop/assets/fonts/Geist-Regular.ttf
        group: Loom/Resources/Fonts
      - path: ../desktop/assets/fonts/Geist-Medium.ttf
        group: Loom/Resources/Fonts
      - path: ../desktop/assets/fonts/Geist-SemiBold.ttf
        group: Loom/Resources/Fonts
      - path: ../desktop/assets/fonts/GeistMono-Regular.ttf
        group: Loom/Resources/Fonts
      - path: ../desktop/assets/fonts/GeistMono-Medium.ttf
        group: Loom/Resources/Fonts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.aaenz.loom
        PRODUCT_NAME: Loom
        INFOPLIST_FILE: Loom/Info.plist
        CODE_SIGN_ENTITLEMENTS: Loom/Loom.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_PREVIEWS: YES
  # The app's unit tests, of what it works out without the core, run in the app in the
  # simulator (ios/README.md, "Testing it").
  LoomTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LoomTests
    dependencies:
      - target: Loom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.aaenz.loom.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete
  # The app driven as a person drives it, with taps and swipes, on sample frames, in its
  # own scheme (ios/README.md, "Driving it").
  LoomUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LoomUITests
    dependencies:
      - target: Loom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.aaenz.loom.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete
schemes:
  Loom:
    build:
      targets:
        Loom: all
        LoomTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LoomTests
  LoomUI:
    build:
      targets:
        Loom: all
        LoomUITests: [test]
    test:
      config: Debug
      targets:
        - LoomUITests
