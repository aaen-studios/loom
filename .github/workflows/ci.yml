name: ci

on:
  push:
    branches: [main]
  pull_request:

# A pull request's newer push stops its older run. On main, each push waits for the
# one before, and only the newest waiting one runs.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CALX_NO_UPDATE_CHECK: "1"
  NO_COLOR: "1"
  CARGO_INCREMENTAL: "0"
  # No debug info in CI's builds: they build faster, and their cache is smaller.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # What a pull request changed, so jobs it can't affect don't run. A push to main runs
  # everything, and so does a change to CI itself or to the pinned Calx.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      calx: ${{ steps.pick.outputs.calx }}
      calx_os: ${{ steps.pick.outputs.calx_os }}
      site: ${{ steps.pick.outputs.site }}
      install: ${{ steps.pick.outputs.install }}
      docker: ${{ steps.pick.outputs.docker }}
      desktop: ${{ steps.pick.outputs.desktop }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            ci:
              - '.github/**'
              - '.calx-version'
            calx:
              - 'shared/**'
              - 'server/**'
              - 'core/**'
              - 'push/**'
              - 'tests/**'
              - 'scripts/**'
              - 'design/**'
            site:
              - 'site/**'
            install:
              - 'shared/**'
              - 'server/**'
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'shared/**'
              - 'server/**'
            desktop:
              - 'desktop/**'
              - 'core/**'
              - 'shared/**'
              - 'server/**'
              - 'design/**'
              - 'tests/setup/**'
              - 'scripts/mac.calx'
              - 'scripts/release.calx'

      - id: pick
        env:
          ALL: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ci == 'true' }}
          CALX: ${{ steps.filter.outputs.calx }}
          SITE: ${{ steps.filter.outputs.site }}
          INSTALL: ${{ steps.filter.outputs.install }}
          DOCKER: ${{ steps.filter.outputs.docker }}
          DESKTOP: ${{ steps.filter.outputs.desktop }}
        run: |
          pick() { if [ "$ALL" = true ] || [ "$2" = true ]; then echo "$1=true"; else echo "$1=false"; fi; }
          {
            pick calx "$CALX"
            pick site "$SITE"
            pick install "$INSTALL"
            pick docker "$DOCKER"
            pick desktop "$DESKTOP"
            # The Mac's Calx checks run on main, and on a change to CI or the pinned Calx:
            # macOS runners are the scarce ones.
            if [ "$ALL" = true ]; then
              echo 'calx_os=["ubuntu-latest","windows-latest","macos-latest"]'
            else
              echo 'calx_os=["ubuntu-latest","windows-latest"]'
            fi
          } | tee -a "$GITHUB_OUTPUT"

  calx:
    name: calx (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.calx == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.calx_os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/calx

      # The sandbox test runs members' agents in rootless Podman, with pasta.
      - name: Podman and pasta (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y passt
          podman --version

      - name: Check and test
        run: calx scripts/check.calx

      - name: The browser a server fetches for itself (Linux)
        if: runner.os == 'Linux'
        run: calx tests/setup/browser_fetch.calx

  # loom.rip's TypeScript check. The site itself is built on the VPS (site/README.md).
  site:
    name: site (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

  # loom install on a fresh server, through install.sh as a person runs it, with a
  # release served from a folder: the user, the service, and the instance answering.
  install:
    name: install (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.install == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/calx

      - name: A release in a folder
        run: |
          mkdir -p release
          calx build server/main.calx -o release/loom-linux
          sum="$(sha256sum release/loom-linux | cut -d ' ' -f 1)"
          printf '{"version":"0.0.0-ci","files":{"linux-server":{"name":"loom-linux","url":"file://%s/release/loom-linux","sha256":"%s"}}}' "$PWD" "$sum" > release/manifest.json

      - name: Install
        run: |
          sudo env LOOM_RELEASES="file://$PWD/release" sh server/install.sh --json | tee install.json
          grep -q '"setup_code":"' install.json || { sudo systemctl status loom --no-pager || true; sudo journalctl -u loom --no-pager | tail -60; exit 1; }

      - name: Check
        run: |
          # Still running a moment later, or what it said before it stopped.
          sleep 2
          if ! systemctl is-active --quiet loom; then
            systemctl status loom --no-pager || true
            sudo journalctl -u loom --no-pager | tail -40
            exit 1
          fi
          test "$(systemctl show -p User --value loom)" = loom
          test "$(ps -o user= -p "$(systemctl show -p MainPID --value loom)")" = loom
          test "$(stat -c %a /var/lib/loom)" = 700
          curl -fsS http://127.0.0.1:8790/api/info | grep -q '"setup":true'
          curl -fsS http://127.0.0.1:8790/api/version | grep -q '"set_up":false'
          grep -q '"version":"' install.json
          sudo -u loom /usr/local/bin/loom status --json --data /var/lib/loom | tee status.json
          grep -q '"user":"loom"' status.json
          # The agents' browser: installed, or there already, with what it lacks installed.
          grep -q "the agents' browser: \|installed the agents' browser: " install.json
          grep -q '"missing":\[\]' status.json

      - name: Sandboxes
        run: |
          # The service runs members' agents in rootless Podman, as loom, and a
          # container with pasta starts for loom from the service's session.
          systemctl show -p ExecStart --value loom | grep -q -- '--sandboxes podman'
          sudo journalctl -u loom --no-pager | grep -q 'run in sandboxes'
          grep -q '^loom:' /etc/subuid
          uid="$(id -u loom)"
          cd /tmp
          sudo -u loom env -i HOME=/var/lib/loom PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin XDG_RUNTIME_DIR="/run/user/$uid" podman run --rm --network pasta docker.io/library/alpine:3.20 true

      # The service updates its own copy, which root never runs; the command line in
      # /usr/local/bin says when the service runs a newer loom than itself.
      - name: The command line and the service's own copy
        run: |
          sudo cmp /usr/local/bin/loom /var/lib/loom/bin/loom
          test ! -L /usr/local/bin/loom
          test "$(stat -c %U /usr/local/bin/loom)" = root
          test "$(sudo stat -c %U /var/lib/loom/bin/loom)" = loom
          # As if the service had updated itself to a newer release.
          perl -pi -e 's/^const VERSION: str = ".*"/const VERSION: str = "9.9.9-ci"/' server/main.calx
          mkdir -p newer
          calx build server/main.calx -o newer/loom
          git checkout -- server/main.calx
          sudo install -o loom -g loom -m 755 newer/loom /var/lib/loom/bin/loom.next
          sudo mv /var/lib/loom/bin/loom.next /var/lib/loom/bin/loom
          sudo systemctl restart loom
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8790/api/version 2>/dev/null | grep -q '"version":"9.9.9-ci"'; then break; fi
            sleep 1
          done
          sudo loom version 2> said.txt
          cat said.txt
          grep -q 'the service runs loom 9.9.9-ci' said.txt
          grep -q 'sudo loom update' said.txt

      - name: Install again
        run: |
          sudo env LOOM_RELEASES="file://$PWD/release" sh server/install.sh
          systemctl is-active loom
          # And the two are the same program again.
          sudo cmp /usr/local/bin/loom /var/lib/loom/bin/loom

  # The Docker image, built as the Dockerfile says, and answering with its setup code.
  docker:
    name: docker (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t loom:ci .

      - name: Run
        run: |
          docker run -d --name loom -p 127.0.0.1:8790:8790 -v loom-ci:/data loom:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8790/api/info > info.json 2>/dev/null; then break; fi
            sleep 1
          done
          cat info.json
          grep -q '"setup":true' info.json
          docker logs loom 2>&1 | grep -q 'setup code:'
          test "$(docker exec loom id -un)" = node
          docker exec loom loom status --json --data /data | tee status.json
          grep -q '"user":"node"' status.json
          # The agents' browser, with fonts, and nothing it lacks.
          grep -q '"browser":{"path":"/usr/bin/chromium","missing":\[\]}' status.json

      - name: Logs
        if: failure()
        run: docker logs loom || true

  desktop:
    name: desktop (windows-latest)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/calx

      - name: Rust
        run: rustup update stable && rustup default stable && rustup component add clippy rustfmt

      - uses: ./.github/actions/cargo
        with:
          job: desktop

      - name: Format
        working-directory: desktop
        run: cargo fmt --check

      - name: Lint
        working-directory: desktop
        run: cargo clippy --locked -- -D warnings

      - name: Test
        working-directory: desktop
        run: cargo test --locked

      # loom's installer and updater (desktop/setup): its own checks, then installing,
      # updating, rolling back and uninstalling in a folder of its own.
      - name: Setup
        working-directory: desktop/setup
        run: |
          cargo fmt --check
          cargo clippy --locked --release -- -D warnings
          cargo test --locked --release

      - name: Setup, end to end
        run: calx tests/setup/e2e.calx

      # A panel that tries every way out of its sandbox (PLAN.md, "The panel sandbox").
      # A run that hangs before it finishes, which WebView2 on a CI runner sometimes
      # does, is tried once more; one that finishes and fails isn't.
      - name: Panel break-out test
        working-directory: desktop
        shell: bash
        run: |
          cargo build --locked
          for attempt in 1 2; do
            status=0
            rm -f panel-test.json
            timeout 150 ./target/debug/loom.exe --panel-test panel-test.json || status=$?
            cat panel-test.json || true
            if [ "$status" = 0 ]; then
              [ "$attempt" = 1 ] || echo "::warning::the panel break-out test hung, and passed when tried again"
              exit 0
            fi
            grep -q '"finished": false' panel-test.json 2>/dev/null || [ ! -f panel-test.json ] || exit "$status"
            echo "the panel break-out test didn't finish (exit $status)"
          done
          exit 1

  # The Mac app: its checks, loom.app and its disk image made as a release's are, and
  # its updates from end to end (tests/setup/mac.calx).
  desktop-macos:
    name: desktop (macos-latest)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/calx

      - name: Rust
        run: rustup update stable && rustup default stable && rustup component add clippy rustfmt

      - uses: ./.github/actions/cargo
        with:
          job: desktop-macos

      - name: Format
        working-directory: desktop
        run: cargo fmt --check

      - name: Lint
        working-directory: desktop
        run: cargo clippy --locked -- -D warnings

      - name: Test
        working-directory: desktop
        run: cargo test --locked

      - name: loom.app and loom-mac.dmg
        env:
          LOOM_VERSION: 0.0.1-dev
        run: |
          (cd desktop && cargo build --locked --release)
          calx scripts/mac.calx app desktop/target/release/loom "$LOOM_VERSION" build/mac
          calx scripts/mac.calx dmg build/mac/loom.app build/mac/loom-mac.dmg
          ls -l build/mac

      # The same break-out test as on Windows, with WKWebView (PLAN.md, "The panel
      # sandbox"). macOS has no timeout command, so perl's alarm stands in.
      - name: Panel break-out test
        run: |
          status=0
          perl -e 'alarm 180; exec @ARGV' desktop/target/release/loom --panel-test panel-test.json || status=$?
          cat panel-test.json || true
          exit $status

      - name: Updates, end to end
        run: calx tests/setup/mac.calx build/mac/loom.app

  # The one check a pull request needs: every job that ran passed, and the rest had
  # nothing to check.
  ci:
    if: always()
    needs: [changes, calx, site, install, docker, desktop, desktop-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success | skipped) ;; *) exit 1 ;; esac
          done
