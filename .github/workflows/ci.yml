name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CALX_NO_UPDATE_CHECK: "1"
  NO_COLOR: "1"

jobs:
  calx:
    name: calx (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Calx (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://calxlang.com/install.sh | sh
          echo "$HOME/.calx/bin" >> "$GITHUB_PATH"

      - name: Install Calx (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://calxlang.com/install.ps1 | iex
          "$HOME\.calx\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Calx version
        run: calx version

      - name: Check and test
        run: calx scripts/check.calx

  desktop:
    name: desktop (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Calx
        shell: pwsh
        run: |
          irm https://calxlang.com/install.ps1 | iex
          "$HOME\.calx\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Rust
        run: rustup update stable && rustup default stable && rustup component add clippy rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Format
        working-directory: desktop
        run: cargo fmt --check

      - name: Lint
        working-directory: desktop
        run: cargo clippy --locked -- -D warnings

      - name: Test
        working-directory: desktop
        run: cargo test --locked

      # A panel that tries every way out of its sandbox (PLAN.md, "The panel sandbox").
      - name: Panel break-out test
        working-directory: desktop
        shell: bash
        run: |
          cargo build --locked
          status=0
          timeout 180 ./target/debug/loom.exe --panel-test panel-test.json || status=$?
          cat panel-test.json || true
          exit $status
