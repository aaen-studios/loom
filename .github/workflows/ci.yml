name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Encoding check
        run: node scripts/check-encoding.mjs

      - name: Typecheck
        run: bun run typecheck

      - name: Frontend tests
        run: bun run test

      - name: Build frontend
        run: bun run build

      - name: Setup app typecheck + build
        run: |
          cd setup
          bun install --frozen-lockfile
          bun run typecheck
          bun run build

      - name: Test engine
        run: cargo test -p loom-core

      - name: Check app crates
        run: cargo check -p loom -p loom-setup
