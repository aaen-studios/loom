<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!--
    The favicon is the app's mark, on a white rounded square matching the
    Windows icon the installer writes. `rx="5.4"` is the app's window radius
    (20px) scaled to a 24-unit grid, so the favicon and the installed app icon
    read as the same object.
  -->
  <rect width="24" height="24" rx="5.4" fill="#ffffff" />
  <g fill="none" stroke="#0a0c16" stroke-width="1.9" stroke-linecap="round">
    <path d="M6.5 5.5c0 6.5 5.5 6.5 5.5 13" />
    <path d="M12 5.5c0 6.5 5.5 6.5 5.5 13" />
    <path d="M6.5 18.5h11" opacity="0.55" />
  </g>
</svg>
