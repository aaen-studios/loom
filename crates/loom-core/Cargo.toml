[package]
name = "loom-core"
version.workspace = true
edition.workspace = true
description = "Loom engine: providers, streaming, tools, storage, config"

[dependencies]
base64 = "0.22"
dirs = "6"
flate2 = "1"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
minisign-verify = "0.2"
sha2 = "0.10"

# Voice mode. `ort` deliberately does NOT use its defaults: they include
# `download-binaries` and `copy-dylibs`, which fetch and bundle ONNX Runtime at
# build time. `load-dynamic` links nothing and loads the runtime from a file at
# run time instead, which is what keeps the installer small.
ort = { version = "2.0.0-rc.13", default-features = false, features = [
    "std",
    "load-dynamic",
    "api-20",
] }

# espeak-ng is reached by hand-written FFI over a prebuilt library, not by these
# bindings. `espeak-rs-sys` runs bindgen (needs libclang) and then compiles
# espeak-ng from source (needs a full C toolchain and the platform headers),
# which on Windows means MSVC Build Tools — a large admin-only dependency for
# four function calls. See `voice/espeak.rs`.
#
# The library itself is loaded at run time, so it is not a build dependency at
# all; `libloading` is.
libloading = "0.8"

# Whisper's mel front-end needs a 400-point FFT per frame. Pure Rust, no build
# step and no C toolchain — which is the whole reason speech-to-text goes
# through ONNX rather than whisper.cpp.
rustfft = "6.4"
zip = { version = "4", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "process", "io-util", "macros"] }
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.9.0"

# Screen capture: DXGI Desktop Duplication on Windows (fast, and honours
# WDA_EXCLUDEFROMCAPTURE so the overlay need not hide), xcap elsewhere.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    # The OLE clipboard: holding the user's clipboard as a data object so
    # pasting text can put back an image or a set of files, not just text.
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(windows))'.dependencies]
xcap = "0.9"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
default = []


