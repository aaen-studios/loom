[workspace]
resolver = "2"
members = ["crates/loom-core", "src-tauri", "setup/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
