[package]
name = "loom-setup"
version = "0.2.0"
edition = "2021"
license = "MIT"
publish = false
description = "loom's installer, updater and uninstaller for Windows"

[[bin]]
name = "loom-setup"
path = "src/main.rs"

# Kept small on purpose: no UI toolkit. The window is plain Win32, drawn by hand with
# tiny-skia (paths) and fontdue (Geist), so the program stays under a megabyte and
# opens at once (README.md).
[dependencies]
tiny-skia = { version = "0.11.4", default-features = false, features = ["std", "simd"] }
fontdue = { version = "0.9.5", default-features = false, features = ["std"] }
ruzstd = { version = "0.8.3", default-features = false, features = ["std"] }
ed25519-dalek = { version = "2.2.0", default-features = false }
sha2 = { version = "0.10.9", default-features = false }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
] }
windows = { version = "0.62", default-features = false, features = [
    "std",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Storage_EnhancedStorage",
] }
windows-core = "0.62"

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
