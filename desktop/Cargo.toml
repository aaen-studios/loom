[package]
name = "loom-desktop"
version = "0.2.0-dev"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "loom"
path = "src/main.rs"

[dependencies]
auto-launch = "0.6.0"
base64 = "0.23.1"
qrcode = { version = "0.15.0", default-features = false }
iana-time-zone = "0.1.65"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# GPUI Kit pins the GPUI it's built on and re-exports it, with gpui-base and
# gpui-component, so this one pin keeps them all in step. Pinned exactly:
# GPUI is pre-1.0, so take each new version on purpose, at the latest.
gpui-kit = "=0.10.0"
png = "0.18.1"
image = { version = "0.25.10", default-features = false, features = ["bmp", "jpeg", "png"] }
# Every JPEG the app shows: Chrome on Linux writes them as a scan per color, which
# image's JPEG decoder, zune-jpeg 0.5.15, and so GPUI's, draws as green stripes.
jpeg-decoder = { version = "0.3.2", default-features = false }
raw-window-handle = "0.6"
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
tray-icon = "0.26.1"
xcap = "0.9.10"
wry = "0.57.3"
async-channel = "2.5.0"
futures-lite = "2.6.1"

[features]
# Frame timing in perf.log in the data folder (src/perf.rs), for measuring the app.
perf = []

[profile.release]
lto = "thin"

[target."cfg(windows)".dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }
windows-core = "0.62"
tauri-winrt-notification = "0.8.1"
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Power", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_System_Registry"] }

[build-dependencies]
winresource = "0.1.34"

[target."cfg(not(windows))".dependencies]
notify-rust = "4.19.0"

# GPUI's Windows platform, as 0.3.12 with two changes (marked "loom:"): its vsync thread
# doesn't tell a hidden or minimised window to paint at every vblank, and looks five times
# a second while no window is on screen; and it tells a window on screen to paint only
# when it has something new to draw. vendor/README.md says more.
[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
