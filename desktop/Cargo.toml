[package]
name = "loom-desktop"
version = "0.2.0-dev"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "loom"
path = "src/main.rs"

[dependencies]
auto-launch = "0.6.0"
base64 = "0.23.1"
qrcode = { version = "0.15.0", default-features = false }
iana-time-zone = "0.1.65"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# GPUI Kit pins the GPUI it's built on and re-exports it, with gpui-base and
# gpui-component, so this one pin keeps them all in step. Pinned exactly:
# GPUI is pre-1.0, so take each new version on purpose, at the latest.
gpui-kit = "=0.10.0"
png = "0.18.1"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
# Every JPEG the app shows: Chrome on Linux writes them as a scan per color, which
# image's JPEG decoder, zune-jpeg 0.5.15, and so GPUI's, draws as green stripes.
jpeg-decoder = { version = "0.3.2", default-features = false }
raw-window-handle = "0.6"
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
tray-icon = "0.26.1"
xcap = "0.9.10"
wry = "0.57.3"
async-channel = "2.5.0"
futures-lite = "2.6.1"
# The mic, for loom's own dictation (src/voice.rs): WASAPI on Windows, Core Audio on a
# Mac. The core does the rest with what it records.
cpal = "0.18.2"

[features]
# Frame timing in perf.log in the data folder (src/perf.rs), for measuring the app.
perf = []

[profile.release]
lto = "thin"

[target."cfg(windows)".dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Foundation", "Data_Xml_Dom", "UI_Notifications"] }
windows-core = "0.62"
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Power", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_Media_Audio", "Win32_UI_Shell"] }

[build-dependencies]
winresource = "0.1.34"

[target.'cfg(all(not(windows), not(target_os = "macos")))'.dependencies]
notify-rust = "4.19.0"

# The window, the Dock, keeping the Mac awake, dictation, notifications with their
# sound, and loom's sounds through NSSound (src/mac.rs), through the same objc2 crates
# GPUI's macOS platform uses.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSResponder", "NSRunningApplication", "NSScreen", "NSSound", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSArray", "NSBundle", "NSData", "NSDate", "NSError", "NSGeometry", "NSObject", "NSProcessInfo", "NSRunLoop", "NSSet", "NSString", "NSURL"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }
# A panel's web view (src/panel.rs): its content rule list, data store and settings.
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "WKContentRuleList", "WKContentRuleListStore", "WKPreferences", "WKUserContentController", "WKWebViewConfiguration", "WKWebsiteDataStore"] }

# The composer's tests drive its editor in GPUI's test platform (`composer_tests` in
# src/app.rs): the same GPUI, with what tests need.
[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }

# GPUI's Windows platform, as 0.3.12 with four changes (marked "loom:"): its vsync thread
# doesn't tell a hidden or minimised window to paint at every vblank, and looks five times
# a second while no window is on screen; it tells a window on screen to paint only when it
# has something new to draw; its shader draws an image moved by a transformation; and it
# shows the system's pan cursors, the last two as gpui-pre below asks. vendor/README.md
# says more.
[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
# GPUI Base, as 0.10.0 with five changes (marked "loom:"): an inline <span> in Markdown can
# give its text a color and weight, for an agent's name where a message mentions it; a
# link in such a span keeps that colour, with a light background of it under the pointer;
# an emoji drawn as a picture (a `loom-emoji` source) is one character to the selection,
# highlighted as the words beside it, and copies as its alt text; a picture in a line of
# text shows its link's tooltip, for the emoji card; and an input tells a token's renderer
# its selection's colour while that selection shows over it, for the composer's pieces.
gpui-base = { path = "vendor/gpui-base" }
# GPUI, as 0.3.12 with three changes (marked "loom:"): an image can be drawn rotated, as an
# SVG icon can, through Window::paint_image_transformed, for the tilted cards of a message's
# pictures; Window::set_pan_cursor shows a browser's middle-button scrolling cursors over
# every other, with Window::hovered_cursor_style saying what's under the pointer; and text
# wrapped at one width doesn't answer for its size at another, so a reply's bubble takes
# the chat's width. Its Metal and wgpu renderers below draw the rotated image on the Mac
# and on Linux.
gpui-pre = { path = "vendor/gpui-pre" }
# GPUI's Metal renderer, as 0.3.12 with the same change (marked "loom:") in its shaders.
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
# GPUI's wgpu renderer, as 0.3.12 with the same change (marked "loom:") in its shaders.
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
# GPUI's macOS platform, as 0.3.12 with one change (marked "loom:"): it draws the cursors
# of a browser's middle-button scrolling, which macOS hasn't got, for GPUI's PanCursor.
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
