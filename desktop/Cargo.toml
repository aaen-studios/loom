[package]
name = "loom-desktop"
version = "0.2.0-dev"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "loom"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# GPUI Kit pins the GPUI it's built on and re-exports it, with gpui-base and
# gpui-component, so this one pin keeps them all in step. Pinned exactly:
# GPUI is pre-1.0, so take each new version on purpose, at the latest.
gpui-kit = "=0.10.0"
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }

[profile.release]
lto = "thin"
