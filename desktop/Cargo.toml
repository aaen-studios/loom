[package]
name = "loom-desktop"
version = "0.2.0-dev"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "loom"
path = "src/main.rs"

[dependencies]
auto-launch = "0.6.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# GPUI Kit pins the GPUI it's built on and re-exports it, with gpui-base and
# gpui-component, so this one pin keeps them all in step. Pinned exactly:
# GPUI is pre-1.0, so take each new version on purpose, at the latest.
gpui-kit = "=0.10.0"
notify-rust = "4.19.0"
png = "0.18.1"
image = { version = "0.25.10", default-features = false, features = ["bmp", "png"] }
raw-window-handle = "0.6"
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
tray-icon = "0.26.1"

[profile.release]
lto = "thin"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading"] }

[build-dependencies]
winresource = "0.1.34"
